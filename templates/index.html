<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="PICK AI는 김민석이 만든 개인 AI 챗봇입니다. Ollama 기반으로 인터넷 검색, 전 세계 날씨, 유튜브 검색을 지원합니다.">
<meta name="keywords" content="PICK AI, PICK, 김민석, 개인 AI 챗봇, Ollama, 인터넷 검색 AI, 날씨 AI">
<meta name="author" content="김민석"><meta property="og:title" content="PICK AI - 김민석이 만든 개인 AI 챗봇"><meta property="og:description" content="Ollama 기반 개인 AI 챗봇 PICK."><meta property="og:type" content="website"><meta property="og:url" content="{{ public_url }}"><link rel="stylesheet" href="/static/style.css?v=pick-v11"><title>PICK AI</title></head><body><header class="topbar"><div class="brand"><div class="logo">P</div><div><h1>PICK</h1><p>PICK</p></div></div><div class="top-actions"><button class="status-btn" type="button" onclick="newChat()">새 채팅</button><button class="status-btn" type="button" onclick="checkStatus()">상태</button><a class="logout" href="/logout">로그아웃</a></div></header><div class="layout clean"><aside class="sidebar"><div class="side-title">채팅 목록</div><div id="chatList"></div></aside><main class="main"><div id="chat" class="chat"><div class="row ai-row"><div class="avatar">P</div><div class="bubble ai">안녕하세요. 무엇을 도와드릴까요?</div></div></div></main></div><form id="composer" class="composer"><textarea id="message" placeholder="메시지를 입력하세요" rows="1"></textarea><button id="sendBtn" type="submit">전송</button></form><script>
let currentChatId=null;const chat=document.getElementById('chat'),form=document.getElementById('composer'),input=document.getElementById('message'),sendBtn=document.getElementById('sendBtn'),chatList=document.getElementById('chatList');
function addMessage(role,text){const row=document.createElement('div');row.className='row '+(role==='user'?'user-row':'ai-row');if(role==='ai'){const a=document.createElement('div');a.className='avatar';a.textContent='P';row.appendChild(a)}const b=document.createElement('div');b.className='bubble '+role;b.textContent=text;row.appendChild(b);chat.appendChild(row);window.scrollTo(0,document.body.scrollHeight);return b}
function clearChat(){chat.innerHTML=''}
async function loadChats(){try{const res=await fetch('/api/chats');const data=await res.json();chatList.innerHTML='';if(!data.chats||data.chats.length===0){const empty=document.createElement('div');empty.className='empty';empty.textContent='채팅이 없습니다.';chatList.appendChild(empty);return}data.chats.forEach(c=>{const wrap=document.createElement('div');wrap.className='chat-item-wrap';const btn=document.createElement('button');btn.className='chat-item';btn.textContent=c.title||'새 채팅';btn.onclick=()=>openChat(c.id);const del=document.createElement('button');del.className='delete-chat';del.textContent='삭제';del.onclick=()=>deleteChat(c.id);wrap.appendChild(btn);wrap.appendChild(del);chatList.appendChild(wrap)})}catch(e){}}
async function newChat(){const res=await fetch('/api/chats/new',{method:'POST'});const data=await res.json();currentChatId=data.chat.id;clearChat();addMessage('ai','새 채팅을 시작했습니다. 무엇을 도와드릴까요?');await loadChats()}
async function openChat(id){currentChatId=id;clearChat();const res=await fetch(`/api/chats/${id}/messages`);const data=await res.json();if(!data.messages||data.messages.length===0){addMessage('ai','이 채팅에는 아직 메시지가 없습니다.');return}data.messages.forEach(m=>addMessage(m.role==='user'?'user':'ai',m.content))}
async function deleteChat(id){if(!confirm('이 채팅을 삭제할까요?'))return;await fetch(`/api/chats/${id}/delete`,{method:'POST'});if(currentChatId===id){currentChatId=null;clearChat();addMessage('ai','채팅을 삭제했습니다.')}await loadChats()}
async function sendMessage(){const text=input.value.trim();if(!text)return;if(!currentChatId)await newChat();addMessage('user',text);input.value='';input.style.height='auto';const loading=addMessage('ai','잠시만 기다려 주세요...');sendBtn.disabled=true;try{const fd=new FormData();fd.append('message',text);const res=await fetch(`/api/chats/${currentChatId}/send`,{method:'POST',body:fd});const data=await res.json();loading.textContent=data.reply||data.error||'잠시 후 다시 시도해 주세요.';await loadChats()}catch(e){loading.textContent='서버 응답 오류입니다. Render 로그와 배포 상태를 확인해 주세요.'}finally{sendBtn.disabled=false;input.focus()}}
async function checkStatus(){const b=addMessage('ai','상태 확인 중...');try{const res=await fetch('/api/status');const d=await res.json();b.textContent='인터넷: '+(d.internet?'정상':'불안정')+'
Ollama: '+(d.ollama?'정상':'연결 안 됨')+'
모델: '+d.model+'
현재 시간: '+d.time+(d.error?'
오류: '+d.error:'')}catch(e){b.textContent='상태 확인 중 오류가 발생했습니다.'}}
form.addEventListener('submit',e=>{e.preventDefault();sendMessage()});input.addEventListener('keydown',e=>{if(e.isComposing)return;if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,180)+'px'});window.addEventListener('load',loadChats);
</script></body></html>
