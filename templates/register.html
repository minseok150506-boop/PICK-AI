<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PICK 회원가입</title><link rel="stylesheet" href="/static/style.css?v=search-time-v1"></head><body class="login-body"><main class="login-card"><div class="login-logo">P</div><h1>회원가입</h1><p>PICK 계정을 만듭니다.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post" autocomplete="off"><label>아이디</label><input name="username" placeholder="영문/숫자/밑줄 3~20자" required autocomplete="off"><label>비밀번호</label><input name="password" type="password" placeholder="비밀번호 6자 이상" required autocomplete="new-password"><label>비밀번호 확인</label><input name="password2" type="password" placeholder="비밀번호 다시 입력" required autocomplete="new-password"><button type="submit">가입하기</button></form><a class="auth-link" href="/login">이미 계정이 있습니다</a></main></body></html>
