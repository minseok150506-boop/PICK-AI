<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>PICK 회원가입</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b1020;color:#fff;font-family:Arial,'Noto Sans KR',sans-serif}
.card{width:380px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:28px}
input{width:100%;height:46px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.2);color:#fff;padding:0 14px;margin:8px 0;box-sizing:border-box}
button{width:100%;height:46px;border:0;border-radius:14px;background:#6d5dfc;color:#fff;font-weight:900;margin-top:12px}
a{color:#c4b5fd}.error{background:rgba(239,68,68,.15);padding:10px;border-radius:12px;color:#fecaca}
</style></head><body>
<div class="card">
<h1>PICK 회원가입</h1>
<p>아이디와 비밀번호에는 한글을 사용할 수 없습니다.</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post">
<input name="username" placeholder="아이디 (영어/숫자/_/-)" pattern="[A-Za-z0-9_-]+" required>
<input name="password" placeholder="비밀번호 (한글 사용 불가)" type="password" pattern="[A-Za-z0-9!@#$%^&*()_\-+=.?]+" required>
<button>회원가입</button>
</form>
<p>이미 계정이 있으신가요? <a href="/login">로그인</a></p>
</div>
<script>
function blockKoreanInput(e){
 const korean=/[ㄱ-ㅎㅏ-ㅣ가-힣]/g;
 if(korean.test(e.target.value)){
   e.target.value=e.target.value.replace(korean,'');
   alert('아이디와 비밀번호에는 한글을 사용할 수 없습니다.');
 }
}
document.querySelectorAll('input[name="username"],input[name="password"]').forEach(el=>el.addEventListener('input',blockKoreanInput));
</script>
</body></html>
