<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>PICK 로그인</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b1020;color:#fff;font-family:Arial,'Noto Sans KR',sans-serif}
.card{width:380px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:28px}
input{width:100%;height:46px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.2);color:#fff;padding:0 14px;margin:8px 0;box-sizing:border-box}
button{width:100%;height:46px;border:0;border-radius:14px;background:#6d5dfc;color:#fff;font-weight:900;margin-top:12px}
a{color:#c4b5fd}.error{background:rgba(239,68,68,.15);padding:10px;border-radius:12px;color:#fecaca}
</style></head><body>
<div class="card">
<h1>PICK 로그인</h1>

{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post">
<input name="username" placeholder="아이디" required>
<input name="password" placeholder="비밀번호" type="password" required>
<button>로그인</button>
</form>
<p>계정이 없으신가요? <a href="/register">회원가입</a></p>
</div></body></html>
