<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>PICK 상태</title></head>
<body style="background:#0b1020;color:#fff;font-family:Arial;padding:30px">
<h1>PICK 서비스 상태</h1>
<p><a href="/" style="color:#c4b5fd">채팅</a> · <a href="/logout" style="color:#c4b5fd">로그아웃</a></p>
<p>사용자: {{ users }}</p><p>대화: {{ convs }}</p><p>메시지: {{ msgs }}</p>
<h2>최근 로그</h2>
{% for log in logs %}
<pre style="background:#111827;padding:12px;border-radius:8px">[{{ log.created_at }}] {{ log.level }} - {{ log.message }}</pre>
{% endfor %}

<section style="max-width:900px;margin:24px auto;padding:16px">
  <h2>미니PC Ollama</h2>
  <p>{{ '정상 연결' if ollama_ok else '연결 실패' }}</p>
  <pre style="white-space:pre-wrap">{{ models }}</pre>
</section>
</body></html>
