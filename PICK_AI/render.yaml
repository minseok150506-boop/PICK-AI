services:
  - type: web
    name: pick-ai
    runtime: python
    region: singapore
    plan: starter
    rootDir: PICK_AI
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 240 --access-logfile - --error-logfile -
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: PICK_DATA_DIR
        value: /tmp/pick-data
      - key: PICK_STORAGE_DIR
        value: /tmp/pick-storage
      - key: PICK_DB_PATH
        value: /tmp/pick-data/pick_service.db
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: PICK_COOKIE_SECURE
        value: "1"
      - key: PICK_TRUST_PROXY_HEADERS
        value: "1"
      - key: PICK_WEB_SEARCH_ENABLED
        value: "1"
      - key: PICK_ADMIN_USERNAME
        value: minseok
      - key: PICK_ADMIN_PASSWORD
        sync: false
      - key: PICK_AI_BACKEND_URL
        sync: false
      - key: PICK_OLLAMA_MODEL
        value: qwen3:8b
      - key: PICK_OLLAMA_FALLBACK_MODELS
        value: qwen3:8b,qwen3:4b
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
